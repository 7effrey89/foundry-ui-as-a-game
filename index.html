<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundry UI as a Game</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="agents-sidebar">
      <div class="sidebar-head">
        <strong>Agents</strong>
        <div class="sidebar-head-buttons">
          <button id="createAgentModalBtn" type="button">+ New</button>
          <button id="loadAgentsBtn" type="button">Reload</button>
        </div>
      </div>
      <div id="agentList" class="agent-list"></div>
    </aside>

    <main class="app">
      <div class="main-layout">

      <section class="panel control-panel">
        <h2>2) Workflow and Messaging</h2>
          <fieldset>
            <legend>Orchestration Pattern</legend>
            <label>Pattern
              <select id="workflowMode">
                <option value="concurrent">Concurrent</option>
                <option value="sequential">Sequential</option>
                <option value="handoff">Handoff</option>
                <option value="group_chat">Group Chat</option>
                <option value="magentic">Magentic</option>
              </select>
            </label>
            <div id="orchestrationInfo" class="orchestration-info"></div>
            <div id="sequentialConfig" class="orchestration-config" style="display:none">
              <label>Context passing
                <select id="handoffMode">
                  <option value="previous_response">Pass previous response only</option>
                  <option value="append_history">Append full context chain</option>
                </select>
              </label>
            </div>
            <div id="handoffConfig" class="orchestration-config" style="display:none">
              <label>Triage Agent
                <select id="triageAgent"><option value="">First enabled agent</option></select>
              </label>
            </div>
            <div id="groupChatConfig" class="orchestration-config" style="display:none">
              <label>Max Rounds
                <input id="maxRounds" type="number" min="1" max="10" value="3" />
              </label>
            </div>
            <div id="magenticConfig" class="orchestration-config" style="display:none">
              <label>Manager Agent
                <select id="managerAgent"><option value="">First enabled agent</option></select>
              </label>
            </div>
          </fieldset>

        <div class="row message-row">
          <textarea id="userMessage" rows="2" placeholder="Type what your character says to the office..."></textarea>
          <button id="sendMessageBtn">Speak to Team</button>
        </div>
        <p id="eventLog" class="log"></p>
      </section>

      <section class="panel world-panel">
        <h2>3) Office View</h2>
        <div id="office" class="office"></div>
      </section>

      </div><!-- /.main-layout -->
    </main>

    <div id="createAgentModal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <div class="modal-head">
          <strong>Create NPC (Creates Foundry Agent)</strong>
          <button id="closeAgentModalBtn" type="button">&times;</button>
        </div>
        <label>Name <input id="npcName" maxlength="40" /></label>
        <label>Description/System Prompt
          <textarea id="npcDescription" rows="4" placeholder="Helpful finance specialist agent"></textarea>
        </label>
        <button id="createNpcBtn">Create NPC Agent</button>
        <p id="modalLog" class="log"></p>
      </div>
    </div>

    <div id="agentDetailModal" class="modal-overlay" style="display:none">
      <div class="modal-box modal-box-wide">
        <div class="modal-head">
          <strong id="agentDetailTitle">Agent Details</strong>
          <button id="closeAgentDetailBtn" type="button">&times;</button>
        </div>
        <div id="agentDetailBody" class="agent-detail-body"></div>
      </div>
    </div>

    <aside class="trace-sidebar" id="traceSidebar">
      <div class="trace-resize-handle" id="traceResizeHandle"></div>
      <div class="trace-head">
        <strong>Session Trace</strong>
        <div class="trace-head-buttons">
          <button id="clearTraceBtn" type="button">Clear</button>
          <button id="hideTraceBtn" type="button">&raquo;</button>
        </div>
      </div>
      <div id="traceList" class="trace-list"></div>
    </aside>
    <div id="infoBubbleTooltip" class="info-bubble-tooltip" style="display:none"></div>
    <button id="showTraceBtn" class="trace-show-tab" style="display:none">&laquo; Trace</button>
  </body>
</html>
