<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundry UI as a Game</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="agents-sidebar">
      <div class="sidebar-head">
        <strong>Agents</strong>
        <button id="loadAgentsBtn" type="button">Reload</button>
      </div>
      <div id="agentList" class="agent-list"></div>
    </aside>

    <main class="app">

      <section class="panel control-panel">
        <h2>2) Agents, Workflow, and Messaging</h2>
        <div class="grid two-col">
          <fieldset>
            <legend>Create NPC (Creates Foundry Agent)</legend>
            <label>Name <input id="npcName" maxlength="40" /></label>
            <label>Description/System Prompt
              <textarea id="npcDescription" rows="4" placeholder="Helpful finance specialist agent"></textarea>
            </label>
            <button id="createNpcBtn">Create NPC Agent</button>
          </fieldset>

          <fieldset>
            <legend>Orchestration Pattern</legend>
            <label>Pattern
              <select id="workflowMode">
                <option value="concurrent">Concurrent</option>
                <option value="sequential">Sequential</option>
                <option value="handoff">Handoff</option>
                <option value="group_chat">Group Chat</option>
                <option value="magentic">Magentic</option>
              </select>
            </label>
            <div id="orchestrationInfo" class="orchestration-info"></div>
            <div id="sequentialConfig" class="orchestration-config" style="display:none">
              <label>Context passing
                <select id="handoffMode">
                  <option value="previous_response">Pass previous response only</option>
                  <option value="append_history">Append full context chain</option>
                </select>
              </label>
            </div>
            <div id="handoffConfig" class="orchestration-config" style="display:none">
              <label>Triage Agent
                <select id="triageAgent"><option value="">First enabled agent</option></select>
              </label>
            </div>
            <div id="groupChatConfig" class="orchestration-config" style="display:none">
              <label>Max Rounds
                <input id="maxRounds" type="number" min="1" max="10" value="3" />
              </label>
            </div>
            <div id="magenticConfig" class="orchestration-config" style="display:none">
              <label>Manager Agent
                <select id="managerAgent"><option value="">First enabled agent</option></select>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="row message-row">
          <input id="userMessage" placeholder="Type what your character says to the office..." />
          <button id="sendMessageBtn">Speak to All</button>
        </div>
        <p id="eventLog" class="log"></p>
      </section>

      <section class="panel world-panel">
        <h2>3) Office View</h2>
        <div id="office" class="office"></div>
      </section>
    </main>

    <aside class="trace-sidebar">
      <div class="trace-head">
        <strong>Agent Trace</strong>
        <button id="clearTraceBtn" type="button">Clear</button>
      </div>
      <div id="traceList" class="trace-list"></div>
    </aside>
  </body>
</html>
